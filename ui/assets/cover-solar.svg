<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.45" stop-color="#FFA06F"/>
      <stop offset="1" stop-color="#E7495B"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.38" cy="0.32" r="0.76">
      <stop offset="0" stop-color="#FFF8DD"/>
      <stop offset="0.55" stop-color="#FFE08D"/>
      <stop offset="1" stop-color="#FF9D57"/>
    </radialGradient>
    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CE2F4C"/>
      <stop offset="1" stop-color="#8E1939"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.35"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="356" cy="196" r="150" fill="url(#sun)"/>
  <circle cx="356" cy="196" r="195" fill="none" stroke="#FFF3D1" stroke-width="1.2" opacity="0.42"/>
